# Merges Dependabot's patch and minor updates once the ruleset's required
# check passes; majors wait for a person. The merge uses the release App's
# token: a merge made with GITHUB_TOKEN starts no push run on main, and the
# workflows permission lets it change files under .github/workflows/.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot-automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional, 0 samples
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # merge, wait or skip; tests/cmake/dependabot.cmake runs this program.
      - id: decide
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          decision=$(jq -n -e -r --arg login "$LOGIN" --arg type "$TYPE" 'if $login != "dependabot[bot]" then "skip" elif $type == "version-update:semver-patch" or $type == "version-update:semver-minor" then "merge" else "wait" end')
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      # The client ID is not a secret and is written here because Actions
      # variables may not reach Dependabot-triggered runs; the key is stored
      # as a Dependabot secret too.
      - id: token
        if: steps.decide.outputs.decision == 'merge'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liRlBEtMHhK6V7Yk
          private-key: ${{ secrets.MUHTARI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - if: steps.decide.outputs.decision == 'merge'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
