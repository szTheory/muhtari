name: APT recovery diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  apt-route:
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # bounded one-off diagnostic; no product or publication work
    steps:
      - name: System and APT resolution
        run: |
          cat /etc/os-release
          cat /etc/resolv.conf
          cat /etc/apt/apt-mirrors.txt
          cat /etc/apt/sources.list.d/ubuntu.sources
          apt-config dump | sed -n '/Acquire::.*Retries/p; /Acquire::.*Timeout/p'
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com packages.microsoft.com mirrors.edge.kernel.org; do
            echo "=== DNS $host ==="
            timeout 4 getent ahostsv4 "$host" || true
            timeout 4 sudo -u _apt getent ahostsv4 "$host" || true
          done
          for host in archive.ubuntu.com mirrors.edge.kernel.org; do
            echo "=== HTTPS $host ==="
            curl --fail --silent --show-error --head --connect-timeout 5 --max-time 10 "https://$host/ubuntu/dists/resolute/InRelease" || true
          done
      - name: Original signed APT route
        continue-on-error: true
        run: timeout 40 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update --error-on=any
      - name: Alternate signed mirror route
        run: |
          # Preserve suites, components, architecture and Signed-By. Only URI changes.
          sed 's|^URIs:.*|URIs: https://mirrors.edge.kernel.org/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources > "$RUNNER_TEMP/ubuntu-recovery.sources"
          cat "$RUNNER_TEMP/ubuntu-recovery.sources"
          timeout 90 sudo apt-get -o "Dir::Etc::sourcelist=$RUNNER_TEMP/ubuntu-recovery.sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 update --error-on=any
          timeout 60 sudo apt-get -o "Dir::Etc::sourcelist=$RUNNER_TEMP/ubuntu-recovery.sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 install -y --no-install-recommends valgrind
          valgrind --version
