# Continuous integration. Every job runs the same `cmake --workflow --preset`
# command as a local build, then checks that every test it expected ran. The
# ruleset requires one check, `CI required`. docs/testing.md describes the jobs.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build; empty builds the caller's commit"
        type: string
        required: false
        default: ""

# No trigger-level path filter: a workflow skipped by paths leaves the
# required check pending. The changes job decides what runs instead.

permissions:
  contents: read
  actions: read

# The instructions-per-frame gate reports only until it is armed; arming is
# one ci: pull request setting this to "true" (docs/testing.md, "Performance").
env:
  MUHTARI_PERF_ARMED: "true"

# Only a pull request's runs supersede each other, so every main commit keeps
# a result. The workflow name is part of the group because a call from
# release.yml sees the caller's context: its run must not queue behind the
# push run on the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # heavy=false only for a pull request whose every changed path, old and new
  # name, is under .planning/; then the heavy jobs are skipped.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 7 s, n=4, run 39611531779; provisional
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      # A failed listing adds a path outside .planning/, so it counts as heavy;
      # CHANGED catches a listing cut short at the API's 3000 files.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo heavy=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          { gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' || echo '(listing failed)'; } |
            sh scripts/classify-changes.sh "$CHANGED" | tee -a "$GITHUB_OUTPUT"

  # The image has clang-format-21, clang-tidy-21 and jq; configure finds them.
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 40 s, n=4, run 39531241714; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      # policy.cartdb_generated regenerates src/cartdb.c from these.
      - name: Fetch the MAME software lists
        run: |
          scripts/fetch-pin.sh mame-a7800-xml build/pins/mame
          scripts/fetch-pin.sh mame-a2600-xml build/pins/mame
      - run: cmake --workflow --preset hygiene
      - name: Every test ran
        run: cmake -DJUNIT=build/hygiene/junit.xml -DINVENTORY=tests/inventory/hygiene.txt -P tests/cmake/check_junit.cmake
      - name: Quality observations and independent base
        run: >-
          cmake -DROOT=. -DBUILD=build/hygiene -DOUT=build/hygiene/quality-current.json
          -DSHA="$(git rev-parse HEAD)" -DCONFIG=hygiene -DBUILD_BASE=ON
          -DSOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          -P tests/cmake/quality_evidence.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-hygiene
          path: |
            build/hygiene/quality-current.json
            build/hygiene/quality-base.json
            build/hygiene/quality-base-policy.json
            build/hygiene/quality-base-sha.txt
          if-no-files-found: error

  # The squash commit takes the pull request's title and body, so the check
  # reads them live: an edit reruns it (the edited trigger) without a commit.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 6 s, n=3, run 39617860376; provisional
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Conventional Commit title, no skip token
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            sh scripts/check-title.sh "$title"

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 30 || 10 }}  # provisional Windows controls; other 2 x 286s, run 39874751162
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, preset: ci, os: linux, arch: x64, wasmtime: x86_64-linux }
          - { runner: ubuntu-26.04-arm, preset: ci, os: linux, arch: arm64, wasmtime: aarch64-linux }
          - { runner: macos-15, preset: ci, os: macos, arch: arm64, wasmtime: aarch64-macos }
          - { runner: macos-15-intel, preset: ci, os: macos, arch: x64, wasmtime: x86_64-macos }
          - { runner: windows-2025, preset: ci-msvc, os: windows, arch: x64, wasmtime: x86_64-windows }
          - { runner: windows-11-arm, preset: ci-msvc, os: windows, arch: arm64, wasmtime: aarch64-windows }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      # The MSVC developer environment for the runner's own architecture,
      # without a third-party action.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV } }
      # built.<name> builds 7800basic's samples and OpenBIOS with these
      # (tests/built/), libretro.rcheevos compiles rcheevos' resolver;
      # configure stops when any is missing.
      - name: Fetch wasmtime, 7800basic, OpenBIOS and rcheevos
        env:
          WASMTIME: wasmtime-${{ matrix.wasmtime }}
        run: |
          scripts/fetch-pin.sh "$WASMTIME" build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
          scripts/fetch-pin.sh rcheevos build/pins/rcheevos
      - name: Build, test, package
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DEXCLUDE=release -P tests/cmake/check_junit.cmake
      - name: Every release test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit-release.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=release -P tests/cmake/check_junit.cmake
      - name: README install line
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        run: cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -P tests/cmake/install_line.cmake
      - name: Quality observations and independent base
        run: >-
          cmake -DROOT=. -DBUILD=build/${{ matrix.preset }} -DOUT=build/${{ matrix.preset }}/quality-current.json
          -DSHA="$(git rev-parse HEAD)" -DCONFIG=${{ matrix.preset }} -DBUILD_BASE=ON
          -DSOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          -P tests/cmake/quality_evidence.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.preset }}/quality-current.json
            build/${{ matrix.preset }}/quality-base.json
            build/${{ matrix.preset }}/quality-base-policy.json
            build/${{ matrix.preset }}/quality-base-sha.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/muhtari-*.zip
          if-no-files-found: error
      # The commit these archives were built from; a release publishes only
      # archives that all record its own commit.
      - name: The commit built
        run: git rev-parse HEAD > build/${{ matrix.preset }}/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.preset }}/hashes.txt
            build/${{ matrix.preset }}/commit.txt
          if-no-files-found: error

  asan:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # provisional independent current/base work completed at 298s, cancelled at300s, run 39875580833
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      # clang-21 is on the image; its sanitizer runtimes may not be.
      - name: Sanitizer runtimes
        run: dpkg -s libclang-rt-21-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-rt-21-dev; }
      - name: Fetch wasmtime, 7800basic, OpenBIOS and rcheevos
        run: |
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
          scripts/fetch-pin.sh rcheevos build/pins/rcheevos
      - run: cmake --workflow --preset asan
      # The abi and release checks read binary shapes the instrumentation changes.
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/asan/junit.xml -DINVENTORY=tests/inventory/ci.txt
          "-DEXCLUDE=abi|release" -P tests/cmake/check_junit.cmake
      - name: Quality observations and independent base
        run: >-
          cmake -DROOT=. -DBUILD=build/asan -DOUT=build/asan/quality-current.json
          -DSHA="$(git rev-parse HEAD)" -DCONFIG=asan -DBUILD_BASE=ON
          -DSOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          -P tests/cmake/quality_evidence.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-asan
          path: |
            build/asan/quality-current.json
            build/asan/quality-base.json
            build/asan/quality-base-policy.json
            build/asan/quality-base-sha.txt
          if-no-files-found: error

  nofp:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: nofp (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5  # network floor; max 24/40 s, x64 n=3/arm64 n=9, runs 39617761785/39614799435; provisional
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset nofp
      - name: Every test ran
        run: cmake -DJUNIT=build/nofp/junit.xml -DINVENTORY=tests/inventory/nofp.txt -P tests/cmake/check_junit.cmake

  # Required PowerPC compilation; full execution/equality runs nightly and on releases.
  be32:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # provisional slow archive fetch censored at300s, run 39875580833; compile-only max33s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Fetch wasmtime, 7800basic, OpenBIOS and rcheevos
        run: |
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
          scripts/fetch-pin.sh rcheevos build/pins/rcheevos
      - name: Cross compiler and qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu g++-powerpc-linux-gnu qemu-user
      - run: cmake --workflow --preset be32-compile

  # Exactly six native runtime files; WASM reports on its own.
  hash-equality:
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # roll-up floor; max 6 s, n=3, run 39614799435; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          path: hashes
      - name: Hashes are byte-identical
        run: |
          rm -rf hashes/hashes-wasm32
          files=$(printf '%s;' hashes/*/hashes.txt)
          cmake "-DFILES=${files%;}" -DCOUNT=6 -DMODE=compare -P tests/cmake/hashes.cmake

  # Report-only: 9/10 distinct successful main executions as of 2026-10-22.
  wasm32:
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 97 s, n=2, run 39614799435; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
      - run: cmake --workflow --preset wasm32
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/wasm32/junit.xml -DINVENTORY=tests/inventory/wasm32.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-wasm32
          path: build/wasm32/hashes.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hashes-linux-x64
          path: hashes-linux-x64
      - name: Same hashes as Linux x64
        run: cmp hashes-linux-x64/hashes.txt build/wasm32/hashes.txt

  # The compatibility ledger judged afresh: every pr-tier row on its built
  # sample or diagnostic, on the fast boot and through OpenBIOS, then the
  # ratchet against the pull request's base ledger (docs/emulation-tests.md,
  # ledger). The full history is fetched for git show of the base. Report-only:
  # 5/10 distinct successful main executions as of 2026-10-22; ten required.
  library:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 31 s, n=3, run 39617761785; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      - name: Fetch wasmtime, 7800basic, OpenBIOS and rcheevos
        run: |
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
          scripts/fetch-pin.sh rcheevos build/pins/rcheevos
      - name: Build the samples and OpenBIOS
        run: |
          cmake --preset ci
          cmake --build --preset ci
          ctest --preset ci -L '^built$'
      - name: Judge the ledger
        env:
          MUHTARI_ROM_DIR: build/ci/built
          MUHTARI_LEDGER_BASE: ${{ github.event.pull_request.base.sha }}
        run: cmake --workflow --preset library
      - name: Every test ran
        run: cmake -DJUNIT=build/library/junit.xml -DINVENTORY=tests/inventory/library.txt -P tests/cmake/check_junit.cmake

  # A real frontend shows the frames the runner hashes: RetroArch from the
  # pinned DMG runs the built core with no content and on the dma diagnostic
  # with an empty system directory; each screenshot, decoded by sips, equals
  # the runner's frame, whose dma hash is the ledger's. A CI step, not a CTest.
  retroarch:
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 5  # network floor; max 31 s, n=9, run 39614799435; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives-macos-arm64
          path: build/archives
      - name: Core and runner from the build
        run: |
          unzip -q build/archives/muhtari-libretro-macos-arm64.zip -d build/libretro
          unzip -q build/archives/muhtari-runner-macos-arm64.zip -d build/runner
      - name: RetroArch 1.22.2 from the pinned DMG
        run: |
          scripts/fetch-pin.sh retroarch-dmg build/dmg
          hdiutil attach build/dmg/RetroArch_Metal.dmg -nobrowse -readonly -mountpoint build/mount
          ditto build/mount/RetroArch.app build/RetroArch.app
          hdiutil detach build/mount
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/RetroArch.app/Contents/Info.plist)
          echo "RetroArch $version"
          test "$version" = 1.22.2
      - name: RetroArch runs the core with no content
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/muhtari_libretro.dylib -DINFO=build/libretro/info/muhtari_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra" -DFRAMES=5
          "-DSHOT=$PWD/build/frames/shot.png" -P tests/retroarch/run_retroarch.cmake
      - name: RetroArch runs the dma diagnostic
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/muhtari_libretro.dylib -DINFO=build/libretro/info/muhtari_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra-dma" -DFRAMES=120 -DROM=tests/diag/dma.a78
          "-DSHOT=$PWD/build/frames/dma-shot.png" -P tests/retroarch/run_retroarch.cmake
      - name: The screenshots equal the runner's frames
        working-directory: build/frames
        run: |
          ../runner/bin/muhtari-run --frames 5 --dump-frame 5:runner.png
          ../runner/bin/muhtari-run --frames 120 --dump-frame 120:dma-runner.png --hash-frame 120 ../../tests/diag/dma.a78 | tee hash.txt
          grep "^diag/dma,.*,title@120=$(cut -d' ' -f4 hash.txt)," ../../tests/compat/ledger.csv
          for f in runner shot dma-runner dma-shot; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          cc -std=c17 -O2 -Wall -Wextra -Werror -o compare ../../tests/retroarch/bmp.c ../../tests/retroarch/compare.c
          for pair in runner:shot dma-runner:dma-shot; do
            ./compare "${pair%:*}.bmp" "${pair#*:}.bmp" | tee compare.txt
            grep -q '^320x242, every pixel equal$' compare.txt
          done
      # Fault prevented: a compare that cannot fail. One byte of pixel (7,3)
      # in a copy of the runner's BMP is inverted, at an offset read from
      # the BMP header; the tool must exit 1 naming exactly that pixel.
      - name: The compare's negative control
        working-directory: build/frames
        run: |
          cp runner.bmp flipped.bmp
          field() { od -An -t "$1" -j "$2" -N "$3" flipped.bmp | tr -d ' \n'; }
          data=$(field u4 10 4) width=$(field u4 18 4) height=$(field d4 22 4) bpp=$(field u2 28 2)
          x=7 y=3 row=3
          if [ "$height" -gt 0 ]; then row=$((height - 1 - y)); fi
          off=$((data + row * ((width * bpp + 31) / 32 * 4) + x * bpp / 8))
          byte=$(field u1 "$off" 1)
          printf "$(printf '\\%03o' $((byte ^ 255)))" | dd of=flipped.bmp bs=1 seek="$off" conv=notrunc 2> /dev/null
          rc=0
          out=$(./compare shot.bmp flipped.bmp) || rc=$?
          echo "$out (exit $rc)"
          if [ "$rc" -ne 1 ]; then exit 1; fi
          case $out in "first difference at $x,$y: "*) ;; *) exit 1 ;; esac
      - name: RetroArch log
        if: failure()
        run: cat build/ra/retroarch.log build/ra-dma/retroarch.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retroarch-frames
          path: build/frames/*.png

  # Cachegrind instructions per frame of the test card, the pull request's
  # merge commit against its first parent measured twice (docs/testing.md,
  # "Performance"). Direct runs only: release.yml's nested call checks out the
  # pull request head, whose first parent is not the merge base, and
  # github.event_name cannot tell that call apart, so the condition reads
  # inputs.ref. On workflow_dispatch it measures one commit three times.
  perf:
    needs: changes
    if: ${{ !inputs.ref && needs.changes.outputs.heavy == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 47 s, n=1, run 39614799435; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Cachegrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      # Both runners are installed under paths of equal length, so the path
      # Cachegrind and the loader see costs the same instructions. NO_BASE is
      # decided from the base tree's contents only: a base that has presets
      # and fails to build fails this step. MUHTARI_TESTS OFF builds the
      # runner without registering the tests, so neither tree needs the
      # sample's tools; a base from before the option ignores it.
      - name: Build the runner at head and base
        id: build
        env:
          EVENT: ${{ github.event_name }}
        run: |
          build() {
            (cd "$1" && cmake --preset ci -DMUHTARI_TESTS=OFF > /dev/null && cmake --build --preset ci --target muhtari-run &&
              cmake --install build/ci --component runner --prefix "$2")
          }
          build . "$RUNNER_TEMP/perf/head"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo no_base=none >> "$GITHUB_OUTPUT"
          elif git cat-file -e 'HEAD^1:CMakePresets.json' 2> /dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" 'HEAD^1'
            build "$RUNNER_TEMP/base" "$RUNNER_TEMP/perf/base"
            echo no_base=false >> "$GITHUB_OUTPUT"
          else
            echo "perf: base HEAD^1 has no CMakePresets.json; verdict NO_BASE"
            echo no_base=true >> "$GITHUB_OUTPUT"
          fi
      - name: Instructions per frame
        env:
          EVENT: ${{ github.event_name }}
          NO_BASE: ${{ steps.build.outputs.no_base }}
        run: |
          valgrind=$(command -v valgrind)
          # Ir of one run of the runner under $1 for $2 frames, from the
          # summary line of Cachegrind's output; empty output is a failure.
          ir() {
            rm -f "$RUNNER_TEMP/cg.out"
            env -i "$valgrind" --tool=cachegrind --cache-sim=no --cachegrind-out-file="$RUNNER_TEMP/cg.out" \
              "$1/bin/muhtari-run" --frames "$2" > /dev/null 2>&1 || return 1
            local v
            v=$(sed -n 's/^summary: *\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/cg.out")
            [ -n "$v" ] || return 1
            echo "$v"
          }
          # Ir/frame = (Ir at 360 frames - Ir at 60) / 300, in integers.
          per_frame() {
            local a b
            a=$(ir "$1" 60) || return 1
            b=$(ir "$1" 360) || return 1
            echo $(( (b - a) / 300 ))
          }
          head=$(per_frame "$RUNNER_TEMP/perf/head")
          if [ "$NO_BASE" = none ]; then
            h2=$(per_frame "$RUNNER_TEMP/perf/head")
            h3=$(per_frame "$RUNNER_TEMP/perf/head")
            max=$head min=$head
            for v in "$h2" "$h3"; do
              if [ "$v" -gt "$max" ]; then max=$v; fi
              if [ "$v" -lt "$min" ]; then min=$v; fi
            done
            line="perf control testcard runs=$head,$h2,$h3 spread=$((max - min))"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base1='' base2=''
          if [ "$NO_BASE" = false ]; then
            base1=$(per_frame "$RUNNER_TEMP/perf/base")
            base2=$(per_frame "$RUNNER_TEMP/perf/base")
          fi
          rc=0
          cmake -DROM=testcard "-DHEAD=$head" "-DBASE1=$base1" "-DBASE2=$base2" -DALLOW=tests/perf/allow.txt \
            "-DARMED=$MUHTARI_PERF_ARMED" "-DNO_BASE=$NO_BASE" \
            -P tests/cmake/perf_compare.cmake > perf.txt 2>&1 || rc=$?
          cat perf.txt
          grep '^perf ' perf.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -eq 0 ]; then
            jq -n --arg head "$(git rev-parse HEAD)" --arg base "$(git rev-parse HEAD^1)" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg tools "$(cc --version | head -1);$("$valgrind" --version)" \
              --argjson value "$head" --arg baseline "$base1" --arg repeated "$base2" \
              '{producer:"tests/cmake/perf_compare.cmake",configuration:"testcard;360-60/300;equal-paths;stripped-env",tools:$tools,units:"Ir/frame",direction:"ceiling",availability:"advisory",sha:$head,base_sha:$base,source:$source,value:$value,baseline:$baseline,repeated:$repeated,status:(if $baseline == "" or $baseline != $repeated then "unavailable" else "measured" end)}' > quality-perf.json
          fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: quality-perf
          path: quality-perf.json
          if-no-files-found: error

  # One threshold authority consumes exact, same-run producer artifacts.
  quality:
    needs: [changes, hygiene, build, asan, perf]
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # roll-up/network floor; provisional until hosted acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-*
          path: quality-inputs
      - name: Trusted policy and actual bounds
        env:
          PERF_REQUIRED: ${{ !inputs.ref && github.event_name == 'pull_request' }}
        run: |
          base=$(jq -r '.pull_request.base.sha // .before // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$base" ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then base=$(git rev-parse HEAD^1); fi
          git cat-file -e "$base^{commit}"
          if [ -z "$(git ls-tree --name-only "$base" quality.json)" ]; then
            printf '{"metrics":{}}\n' > trusted-quality.json
          else
            git show "$base:quality.json" > trusted-quality.json
          fi
          cmake -DDIRECTORY=quality-inputs -DOUT=quality-output -DPOLICY=quality.json -DBASE_POLICY=trusted-quality.json \
            -DEXPECTED_SHA="$(git rev-parse HEAD)" -DBASE_SHA="$base" -DPERF_REQUIRED="$PERF_REQUIRED" \
            -DSOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -P tests/cmake/quality_join.cmake > quality-report.txt 2>&1 || { cat quality-report.txt; exit 1; }
          cat quality-report.txt
          cat quality-report.txt >> "$GITHUB_STEP_SUMMARY"

  # The one required check. GitHub reports a skipped job as success and skips
  # a job whose dependency failed, so this always runs and requires every
  # result to be success, except: a heavy job skipped when changes said
  # heavy=false; title and perf skipped outside pull requests; and perf
  # skipped in a nested call that passes ref (release.yml's).
  ci-required:
    name: CI required
    if: always()
    needs: [changes, hygiene, title, build, asan, nofp, be32, hash-equality, retroarch, perf, quality]
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # roll-up floor; max 4 s, n=4, run 39617860376; provisional
    steps:
      - name: Every job succeeded or was skipped as allowed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          CALLED: ${{ inputs.ref && 'true' || 'false' }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" --arg heavy "$HEAVY" --arg called "$CALLED" 'keys == ["asan","be32","build","changes","hash-equality","hygiene","nofp","perf","quality","retroarch","title"] and (to_entries | all(
            .value.result == "success"
            or (.key == "title" and .value.result == "skipped" and $event != "pull_request")
            or (.key == "perf" and .value.result == "skipped" and ($event != "pull_request" or $called == "true"))
            or ($heavy == "false" and .value.result == "skipped" and (.key | IN("changes", "hygiene", "title") | not))))'
