# Nightly: the bench, 300,000 headless frames of the test card per platform,
# as trend data, never a gate (docs/testing.md, "Performance"); the full
# SingleStepTests 6502 set at its pin (the vectors-full preset); the loader
# and run fuzz targets for 60 s each (the fuzz preset); and the property
# tests at 10,000 cases each (docs/emulation-tests.md, prop). Reports go to
# job summaries and artifacts, never to commits. A failed night opens or
# updates the one open issue labelled nightly; a good night closes it.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail the run on purpose, to show the nightly issue being written"
        type: boolean
        default: false
  # A pull request runs every job when it changes a file whose break could
  # show only here, not in ci.yml: this workflow, the core and runner
  # sources, the build files and pins, and each job's own tests, scripts and
  # inventories. A new source file also changes CMakeLists.txt, which lists
  # it. The report job writes no issue for pull requests.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .github/workflows/be-equality.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - include/**
      - pins.txt
      - scripts/fetch-pin.sh
      - runner/**
      - src/**
      - libretro/**
      - tests/**
      - tools/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  be-equality:
    uses: ./.github/workflows/be-equality.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  # max_rss_kb from /usr/bin/time: -v on Linux reports kilobytes, -l on macOS
  # reports bytes.
  bench:
    name: bench (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5  # network floor; max 109 s, each leg n=2, run 39529469620; provisional
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GNU time
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends time
      - run: cmake --workflow --preset bench
      - name: Bench 300,000 frames
        env:
          LABEL: ${{ matrix.runner }}
        run: |
          mkdir -p report
          if [ "$RUNNER_OS" = Linux ]; then
            /usr/bin/time -v build/bench/runner/muhtari-run --bench 300000 > report/bench.txt 2> report/time.txt
            rss=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): \([0-9][0-9]*\)$/\1/p' report/time.txt)
          else
            /usr/bin/time -l build/bench/runner/muhtari-run --bench 300000 > report/bench.txt 2> report/time.txt
            bytes=$(sed -n 's/^[[:space:]]*\([0-9][0-9]*\)[[:space:]]*maximum resident set size$/\1/p' report/time.txt)
            rss=${bytes:+$((bytes / 1024))}
          fi
          if [ -z "$rss" ]; then
            echo "bench: no maximum resident set size in the time report"
            cat report/time.txt
            exit 1
          fi
          { cat report/bench.txt; echo "max_rss_kb $rss"; echo "runner $LABEL"; } > report/report.txt
          cat report/report.txt
          { echo "### bench $LABEL"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.runner }}
          path: report/report.txt
          if-no-files-found: error

  # The same bench under the pinned wasmtime, for the browser target. No RSS:
  # it would measure wasmtime, not the runner.
  bench-wasm32:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 116 s, n=2, run 39544379935; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      # MUHTARI_TESTS OFF: the runner only, so configure needs no test tool.
      - name: Build the runner
        run: cmake --preset wasm32 -DMUHTARI_TESTS=OFF && cmake --build --preset wasm32 --target muhtari-run
      - name: Bench 300,000 frames
        run: |
          mkdir -p report
          build/pins/wasmtime/wasmtime run build/wasm32/runner/muhtari-run --bench 300000 > report/bench.txt
          { cat report/bench.txt; echo "runner wasm32-wasmtime-48.0.6"; } > report/report.txt
          cat report/report.txt
          { echo "### bench wasm32-wasmtime-48.0.6"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-wasm32
          path: report/report.txt
          if-no-files-found: error
      # After the upload, so a forced failure still leaves the night's data.
      - name: Forced failure
        if: inputs.force_failure
        run: exit 1

  # All 2,560,000 tests of the pinned 6502/v1 set, fetched fresh each night:
  # no cache, so a night proves the pin still resolves.
  vectors-full:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 100 s including fetch, n=1, run 39544379935; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset vectors-full
      - name: Every test ran
        if: always()
        run: >-
          cmake -DJUNIT=build/vectors-full/junit.xml -DINVENTORY=tests/inventory/vectors-full.txt
          -P tests/cmake/check_junit.cmake

  # The loader and run fuzz targets for 60 s each under ASan and UBSan, from
  # the generated seeds and the committed regressions. Their crashes derive
  # only from synthetic seeds, so they are uploaded.
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 76 s, n=1, run 39544379935; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-21 is on the image; its linker and sanitizer runtimes may not be.
      - name: Clang 21, lld and the sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21 libclang-rt-21-dev
      - run: cmake --workflow --preset fuzz
      - name: Every test ran
        if: always()
        run: cmake -DJUNIT=build/fuzz/junit.xml -DINVENTORY=tests/inventory/fuzz.txt -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash
          path: |
            build/fuzz/fuzz/crash/
            build/fuzz/fuzz/run/crash/
          if-no-files-found: warn

  # The four property tests at 10,000 cases each, seeded with this run's ID,
  # under the names a pull request runs at 100 from a fixed seed. A failure
  # prints the seed and case to rerun locally. MUHTARI_TIMEOUT_SCALE 10 gives
  # each test 390 s; the slowest took 190 s at 10,000 cases, run 39381236115.
  # Report-only: it stays out of report's needs and keeps continue-on-error
  # until it has passed 10 runs on main, then gates with a timeout of twice
  # its slowest run.
  prop:
    runs-on: ubuntu-26.04
    timeout-minutes: 9  # 2 x 246 s, n=2, run 39529469620; provisional
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch wasmtime, 7800basic, OpenBIOS and rcheevos
        run: |
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
          scripts/fetch-pin.sh rcheevos build/pins/rcheevos
      - name: Build
        run: cmake --preset ci -DMUHTARI_TIMEOUT_SCALE=10 && cmake --build --preset ci
      - name: 10,000 cases per property
        env:
          MUHTARI_PROP_CASES: 10000
          MUHTARI_PROP_SEED: ${{ github.run_id }}
        run: ctest --test-dir build/ci -L prop -j 4 --output-on-failure --output-junit "$PWD/build/ci/junit-prop.xml"
      - name: Every test ran
        if: always()
        run: >-
          cmake -DJUNIT=build/ci/junit-prop.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=prop -P tests/cmake/check_junit.cmake

  # Decides from the jobs' results, never from a piped exit status.
  report:
    needs: [bench, bench-wasm32, vectors-full, fuzz, be-equality]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # roll-up floor; max 5 s, n=1, run 39544379935; provisional (skipped on pull requests)
    permissions:
      issues: write
    steps:
      - name: Rolling nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          results=$(jq -r 'to_entries | map("\(.key): \(.value.result)") | join(", ")' <<< "$NEEDS")
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "nightly: success ($results)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Passed ($EVENT) at $SHA: $url"
            fi
            exit 0
          fi
          echo "nightly: failure ($results)"
          body="Failed ($EVENT) at $SHA: $url

          Jobs: $results"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly failed" --label nightly --body "$body"
          fi
