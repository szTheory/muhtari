# Nightly: the bench, 300,000 headless frames of the test card per platform,
# as trend data, never a gate (docs/testing.md, "Performance"); the full
# SingleStepTests 6502 set at its pin (the vectors-full preset); and the
# loader fuzz target for 60 s (the fuzz preset). Reports go to job summaries
# and artifacts, never to commits. A failed night opens or updates the one
# open issue labelled nightly; a good night closes it.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail the run on purpose, to show the nightly issue being written"
        type: boolean
        default: false
  # A change to any job's inputs or this file runs every job on its pull
  # request: one path union for the bench, the vector set and the loader. The
  # report job writes no issue for pull requests.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - runner/bench.c
      - runner/bench.h
      - runner/clock.c
      - runner/clock.h
      - src/cpu.c
      - tests/cpu/**
      - tests/vectors/**
      - tests/cmake/fetch_vectors.cmake
      - tests/cmake/vectors_sample_match.cmake
      - src/cart.c
      - src/cartdb.c
      - src/sha1.c
      - tests/cart/**
      - tests/fuzz/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # max_rss_kb from /usr/bin/time: -v on Linux reports kilobytes, -l on macOS
  # reports bytes.
  bench:
    name: bench (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5  # network-bound floor; slowest leg 108 s in 17 runs, run 39197430512
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GNU time
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends time
      - run: cmake --workflow --preset bench
      - name: Bench 300,000 frames
        env:
          LABEL: ${{ matrix.runner }}
        run: |
          mkdir -p report
          if [ "$RUNNER_OS" = Linux ]; then
            /usr/bin/time -v build/bench/runner/muhtari-run --bench 300000 > report/bench.txt 2> report/time.txt
            rss=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): \([0-9][0-9]*\)$/\1/p' report/time.txt)
          else
            /usr/bin/time -l build/bench/runner/muhtari-run --bench 300000 > report/bench.txt 2> report/time.txt
            bytes=$(sed -n 's/^[[:space:]]*\([0-9][0-9]*\)[[:space:]]*maximum resident set size$/\1/p' report/time.txt)
            rss=${bytes:+$((bytes / 1024))}
          fi
          if [ -z "$rss" ]; then
            echo "bench: no maximum resident set size in the time report"
            cat report/time.txt
            exit 1
          fi
          { cat report/bench.txt; echo "max_rss_kb $rss"; echo "runner $LABEL"; } > report/report.txt
          cat report/report.txt
          { echo "### bench $LABEL"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.runner }}
          path: report/report.txt
          if-no-files-found: error

  # The same bench under the pinned wasmtime, for the browser target. No RSS:
  # it would measure wasmtime, not the runner.
  bench-wasm32:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 2 x 122 s, slowest of 17 runs, run 39197611548
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      # MUHTARI_TESTS OFF: the runner only, so configure needs no test tool.
      - name: Build the runner
        run: cmake --preset wasm32 -DMUHTARI_TESTS=OFF && cmake --build --preset wasm32 --target muhtari-run
      - name: Bench 300,000 frames
        run: |
          mkdir -p report
          build/pins/wasmtime/wasmtime run build/wasm32/runner/muhtari-run --bench 300000 > report/bench.txt
          { cat report/bench.txt; echo "runner wasm32-wasmtime-48.0.6"; } > report/report.txt
          cat report/report.txt
          { echo "### bench wasm32-wasmtime-48.0.6"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-wasm32
          path: report/report.txt
          if-no-files-found: error
      # After the upload, so a forced failure still leaves the night's data.
      - name: Forced failure
        if: inputs.force_failure
        run: exit 1

  # All 2,560,000 tests of the pinned 6502/v1 set, fetched fresh each night:
  # no cache, so a night proves the pin still resolves.
  vectors-full:
    runs-on: ubuntu-26.04
    timeout-minutes: 8  # fetch TIMEOUT 220 s (4 min) + 2 x 118 s, slowest of 15 runs, run 39197673159
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset vectors-full
      - name: Every test ran
        if: always()
        run: >-
          cmake -DJUNIT=build/vectors-full/junit.xml -DINVENTORY=tests/inventory/vectors-full.txt
          -P tests/cmake/check_junit.cmake

  # The loader fuzz target for 60 s under ASan and UBSan, from the generated
  # seeds and the committed regressions. Its crashes derive only from
  # synthetic seeds, so they are uploaded.
  loader-fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network-bound floor; slowest 90 s in 15 runs, run 39195320935
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-21 is on the image; its linker and sanitizer runtimes may not be.
      - name: Clang 21, lld and the sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21 libclang-rt-21-dev
      - run: cmake --workflow --preset fuzz
      - name: Every test ran
        if: always()
        run: cmake -DJUNIT=build/fuzz/junit.xml -DINVENTORY=tests/inventory/fuzz.txt -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: loader-fuzz-crash
          path: build/fuzz/fuzz/crash/
          if-no-files-found: warn

  # Decides from the jobs' results, never from a piped exit status.
  report:
    needs: [bench, bench-wasm32, vectors-full, loader-fuzz]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # roll-up floor; slowest 6 s in 10 runs, run 39197977418 (skipped on pull requests)
    permissions:
      issues: write
    steps:
      - name: Rolling nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          results=$(jq -r 'to_entries | map("\(.key): \(.value.result)") | join(", ")' <<< "$NEEDS")
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "nightly: success ($results)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Passed ($EVENT) at $SHA: $url"
            fi
            exit 0
          fi
          echo "nightly: failure ($results)"
          body="Failed ($EVENT) at $SHA: $url

          Jobs: $results"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly failed" --label nightly --body "$body"
          fi
