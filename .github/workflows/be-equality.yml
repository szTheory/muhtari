# Read-only complete native/PowerPC evidence; publication credentials stay with callers.
name: Native PowerPC equality
on:
  workflow_call:
    inputs:
      ref:
        description: "Immutable commit for equality"
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # Full normal and archive inventories from one checkout. Architecture/compiler,
  # emulator and timeout scale intentionally differ; semantic options do not.
  equality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30  # provisional full inventory; portable max 691 s, run 39614595363
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Immutable checkout identity
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Cross compiler and qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu g++-powerpc-linux-gnu qemu-user
      - name: Fetch identical pinned fixture tools
        run: |
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
          scripts/fetch-pin.sh 7800basic-wasm build/pins/7800basic
          scripts/fetch-pin.sh 7800openbios-asm build/pins/openbios
          scripts/fetch-pin.sh rcheevos build/pins/rcheevos
      - name: Temporary PowerPC ABI diagnosis
        run: |
          cmake --workflow --preset be32-compile
          powerpc-linux-gnu-gcc --version
          powerpc-linux-gnu-gcc -Q --help=target | grep -E 'sdata|readonly'
          qemu-ppc --version
          cmake --version
          powerpc-linux-gnu-nm -P build/be32/libmuhtari.a
          powerpc-linux-gnu-objdump -dr build/be32/CMakeFiles/muhtari_objs.dir/src/synth.c.o
          powerpc-linux-gnu-objdump -t -h build/be32/CMakeFiles/muhtari_cartdb.dir/src/cartdb.c.o
          ctest --test-dir build/be32 -R '^(abi[.](undefined|globals)([.]self_test)?|core[.]audio[.]silence)$' -V --output-junit junit-abi.xml
      - name: Full native and PowerPC inventories, then identity and hash equality
        run: |
          for lane in native be; do
            preset=ci
            workflow=ci
            if [ "$lane" = be ]; then preset=be32; workflow=be32-full; fi
            cmake --workflow --preset "$workflow"
            cmake -DJUNIT=build/$preset/junit.xml -DINVENTORY=tests/inventory/ci.txt -DEXCLUDE=release -P tests/cmake/check_junit.cmake
            cmake -DJUNIT=build/$preset/junit-release.xml -DINVENTORY=tests/inventory/ci.txt -DLABELS=release -P tests/cmake/check_junit.cmake
            mkdir -p evidence/$lane
            cp build/$preset/hashes.txt evidence/$lane/hashes.txt
            git rev-parse HEAD > evidence/$lane/commit.txt
            git ls-tree -r HEAD -- pins.txt tests/roms tests/built tests/diag include/muhtari.h version.txt CMakePresets.json CMakeLists.txt > evidence/$lane/identity.txt
            printf '%s\n' 'Release warnings=error tests=ON libretro=ON short_runs=OFF inventory=ci normal+release' >> evidence/$lane/identity.txt
          done
          cmake -DNATIVE=evidence/native -DBE=evidence/be "-DEXPECTED_SHA=$(git rev-parse HEAD)" -P tests/cmake/lane_equality.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lane-equality
          path: |
            evidence/
            build/ci/junit*.xml
            build/be32/junit*.xml
          if-no-files-found: error

