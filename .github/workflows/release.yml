# Releases. On a push to main, release-please opens or updates the release
# pull request, which the GitHub App's token sets to merge itself; that merge
# creates a draft release, CI runs on its commit, and publish attests,
# verifies and publishes it as latest. On a pull request from this repository
# that touches the release inputs, a rehearsal runs CI on the pull request's
# head and then the same publish steps against a throwaway prerelease, which
# it deletes with its tag. docs/maintaining.md describes the release path and
# docs/testing.md the rehearsal.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/be-equality.yml
      - scripts/publish.sh
      - release-please-config.json
      - cmake/packaging.cmake

permissions:
  contents: read

# Release runs wait for each other and are never cancelled: by default a
# newly queued run cancels the pending one, even without cancel-in-progress.
concurrency:
  group: release-${{ github.ref }}
  queue: max

# A published and deleted tag name can never be reused under immutable
# releases, so every attempt gets its own; "Re-run all jobs" or a new push
# recovers a failed rehearsal.
env:
  REHEARSAL_TAG: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # CI on the commit the rehearsal publishes. GitHub refuses to start a called
  # workflow whose jobs ask for more than this job grants, so these are the
  # union of every permissions block in ci.yml: widen them whenever a ci.yml
  # job asks for more.
  ci:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      pull-requests: read
      actions: read

  equality:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/be-equality.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  # GITHUB_TOKEN only; the App token is for pushes to main.
  rehearsal:
    needs: [ci, equality]
    runs-on: ubuntu-26.04
    timeout-minutes: 14  # provisional n=0 current sound archives; retain historical 2 x 399 s, run 38951834012
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      # The ref a pull_request run attests from, so a rehearsal's
      # attestation never passes for a release's.
      SOURCE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist
      # The six build legs' hashes-<os>-<arch>, each with its commit.txt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*-*
          path: dist/legs
      - name: Use verified GitHub CLI
        run: |
          sh scripts/fetch-pin.sh gh-linux-x86_64 "$RUNNER_TEMP/gh"
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh/bin/gh" --version
      - run: sh scripts/publish.sh prepare dist
      - id: draft
        run: |
          id=$(sh scripts/publish.sh rehearsal-create "$REHEARSAL_TAG") || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - env:
          ID: ${{ steps.draft.outputs.id }}
        run: sh scripts/publish.sh upload "$REHEARSAL_TAG" "$ID" dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --prerelease --latest=false
      # would, but without looking the draft up by its tag.
      - name: Publish as a prerelease that is never latest
        env:
          ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=true -f make_latest=false
      - run: sh scripts/publish.sh verify "$REHEARSAL_TAG" dist

  # The README's install line against the published rehearsal.
  install-line:
    needs: rehearsal
    runs-on: macos-15
    timeout-minutes: 5  # network floor; provisional n=0 current rehearsal; historical max 9 s, run 38943087443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: >-
          cmake -DREADME=README.md
          "-DBASE_URL=https://github.com/szTheory/muhtari/releases/download/$REHEARSAL_TAG/"
          -P tests/cmake/install_line.cmake

  # Last, whatever happened before: the rehearsal release and its tag go.
  cleanup:
    needs: [rehearsal, install-line]
    if: always() && needs.rehearsal.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; provisional n=0 current rehearsal; historical max 17 s, run 38943087443
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          ID: ${{ needs.rehearsal.outputs.id }}
        run: sh scripts/publish.sh rehearsal-delete "$REHEARSAL_TAG" $ID

  # The real path from here on. The App token is minted only here, on a push
  # to main: release-please needs it so that its pull request runs CI.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 23 s, n=3, run 39530116768; provisional
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MUHTARI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MUHTARI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
      # The pipeline's own merge: GitHub merges the release pull request as
      # the App once CI required passes on it.
      - name: Merge the release pull request when CI required passes
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh pr merge --auto --squash "$(printf '%s' "$PR" | jq -r .number)" --repo "$GITHUB_REPOSITORY"

  # CI on the release's commit, release-please's sha output: a later push's
  # run can create the release while its own commit is newer. Same
  # permissions union as the rehearsal's ci job.
  release-ci:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
      actions: read

  release-equality:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/be-equality.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read

  # The rehearsal's steps on release-please's draft, found by its ID because
  # a draft cannot be looked up by its tag. Safe to re-run: uploads replace
  # the draft's assets, and once the release is published a re-run only
  # verifies it.
  publish:
    needs: [release-please, release-ci, release-equality]
    runs-on: ubuntu-26.04
    timeout-minutes: 13  # 2 x 379 s, n=1, run 39533130210; provisional
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
      SOURCE_REF: refs/heads/main
      TAG: ${{ needs.release-please.outputs.tag_name }}
      ID: ${{ needs.release-please.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*-*
          path: dist/legs
      - name: Use verified GitHub CLI
        run: |
          sh scripts/fetch-pin.sh gh-linux-x86_64 "$RUNNER_TEMP/gh"
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh/bin/gh" --version
      - run: sh scripts/publish.sh prepare dist
      - id: state
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft) || exit 1
          case $draft in true | false) ;; *) echo "invalid release draft state" >&2; exit 1 ;; esac
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.draft == 'true'
        run: sh scripts/publish.sh upload "$TAG" "$ID" dist
      - if: steps.state.outputs.draft == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - if: steps.state.outputs.draft == 'true'
        run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --latest would.
      - name: Publish as latest
        if: steps.state.outputs.draft == 'true'
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
      - run: sh scripts/publish.sh verify "$TAG" dist

  # The README's install line, verbatim, against the latest release.
  install-line-latest:
    needs: [release-please, publish]
    runs-on: macos-15
    timeout-minutes: 5  # network floor; max 7 s, n=1, run 39533130210; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - run: >-
          cmake -DREADME=README.md
          -DBASE_URL=https://github.com/szTheory/muhtari/releases/latest/download/
          -P tests/cmake/install_line.cmake
