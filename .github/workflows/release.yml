# Releases. On a push to main, release-please opens or updates the release
# pull request, which the GitHub App's token sets to merge itself; that merge
# creates a draft release, CI runs on its commit, and publish attests,
# verifies and publishes it as latest. On a pull request from this repository
# that touches the release inputs, a rehearsal runs CI on the pull request's
# head and then the same publish steps against a throwaway prerelease, which
# it deletes with its tag. docs/maintaining.md describes the release path and
# docs/testing.md the rehearsal.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - .github/workflows/be-equality.yml
      - scripts/publish.sh
      - scripts/emscripten.sh
      - tests/emscripten/**
      - tests/inventory/emscripten.txt
      - tests/policy/publish.cmake
      - tests/cmake/install_line.cmake
      - docs/emscripten-hosting.md
      - docs/libretro.md
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - PROVENANCE.md
      - release-please-config.json
      - cmake/packaging.cmake
  workflow_dispatch:
    inputs:
      release_id:
        description: "Existing stable release ID to resume after a failed gate"
        type: string
        required: true
      tag_name:
        description: "Expected stable release tag"
        type: string
        required: true
      sha:
        description: "Expected immutable release commit SHA"
        type: string
        required: true

permissions:
  contents: read

# Release runs wait for each other and are never cancelled: by default a
# newly queued run cancels the pending one, even without cancel-in-progress.
concurrency:
  group: release-${{ github.ref }}
  queue: max

# A published and deleted tag name can never be reused under immutable
# releases, so every attempt gets its own; "Re-run all jobs" or a new push
# recovers a failed rehearsal.
env:
  REHEARSAL_TAG: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # CI on the commit the rehearsal publishes. GitHub refuses to start a called
  # workflow whose jobs ask for more than this job grants, so these are the
  # union of every permissions block in ci.yml: widen them whenever a ci.yml
  # job asks for more.
  ci:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      pull-requests: read
      actions: read

  equality:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/be-equality.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  # GITHUB_TOKEN only; the App token is for pushes to main.
  rehearsal:
    needs: [ci, equality]
    runs-on: ubuntu-26.04
    timeout-minutes: 14  # provisional n=0 current sound archives; retain historical 2 x 399 s, run 38951834012
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      # The ref a pull_request run attests from, so a rehearsal's
      # attestation never passes for a release's.
      SOURCE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist
      # The six build legs' hashes-<os>-<arch>, each with its commit.txt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*-*
          path: dist/legs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emscripten-libretro-evidence
          path: dist/emscripten-evidence
      - name: Use verified GitHub CLI
        run: |
          sh scripts/fetch-pin.sh gh-linux-x86_64 "$RUNNER_TEMP/gh"
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh/bin/gh" --version
      - run: sh scripts/publish.sh prepare dist
      - id: draft
        run: |
          id=$(sh scripts/publish.sh rehearsal-create "$REHEARSAL_TAG") || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - env:
          ID: ${{ steps.draft.outputs.id }}
        run: sh scripts/publish.sh upload "$REHEARSAL_TAG" "$ID" dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --prerelease --latest=false
      # would, but without looking the draft up by its tag.
      - name: Publish as a prerelease that is never latest
        env:
          ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=true -f make_latest=false
      - run: sh scripts/publish.sh verify "$REHEARSAL_TAG" dist

  # The README's install line against the published rehearsal.
  install-line:
    needs: rehearsal
    runs-on: macos-15
    timeout-minutes: 5  # network floor; provisional n=0 current rehearsal; historical max 9 s, run 38943087443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: >-
          cmake -DREADME=README.md
          "-DBASE_URL=https://github.com/szTheory/muhtari/releases/download/$REHEARSAL_TAG/"
          -P tests/cmake/install_line.cmake

  # Last, whatever happened before: the rehearsal release and its tag go.
  cleanup:
    needs: [rehearsal, install-line]
    if: always() && needs.rehearsal.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; provisional n=0 current rehearsal; historical max 17 s, run 38943087443
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          ID: ${{ needs.rehearsal.outputs.id }}
        run: sh scripts/publish.sh rehearsal-delete "$REHEARSAL_TAG" $ID

  # The real path from here on. The App token is minted only here, on a push
  # to main: release-please needs it so that its pull request runs CI.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # network floor; max 23 s, n=3, run 39530116768; provisional
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MUHTARI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MUHTARI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
      # The pipeline's own merge: GitHub merges the release pull request as
      # the App once CI required passes on it.
      - name: Merge the release pull request when CI required passes
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh pr merge --auto --squash "$(printf '%s' "$PR" | jq -r .number)" --repo "$GITHUB_REPOSITORY"

  # A dispatch resumes a failed release by explicit identity, then runs the
  # same CI, equality, publication and latest-install gates on that commit.
  release-target:
    needs: release-please
    if: always() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || needs.release-please.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional; new validation path
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.push.outputs.release_created || steps.dispatch.outputs.release_created }}
      tag_name: ${{ steps.push.outputs.tag_name || steps.dispatch.outputs.tag_name }}
      sha: ${{ steps.push.outputs.sha || steps.dispatch.outputs.sha }}
      id: ${{ steps.push.outputs.id || steps.dispatch.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
      - name: Use verified GitHub CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          sh scripts/fetch-pin.sh gh-linux-x86_64 "$RUNNER_TEMP/gh"
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh/bin/gh" --version
      # Draft releases require push access. Mint the narrowest token that can
      # read the draft; dispatch is accepted only from this main-branch file.
      - id: dispatch-app
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MUHTARI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MUHTARI_APP_PRIVATE_KEY }}
          permission-contents: write
      - id: push
        if: github.event_name == 'push'
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_ID: ${{ needs.release-please.outputs.id }}
        run: |
          {
            echo "release_created=${RELEASE_CREATED:-false}"
            echo "tag_name=$TAG_NAME"
            echo "sha=$RELEASE_SHA"
            echo "id=$RELEASE_ID"
          } >> "$GITHUB_OUTPUT"
      - id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.dispatch-app.outputs.token || github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: sh scripts/publish.sh resolve-target "$RELEASE_ID" "$RELEASE_TAG" "$EXPECTED_SHA"

  # Manual dispatch skips release-please. !cancelled() overrides that inherited
  # status while preserving cancellation; later jobs still check each result.
  # CI runs on the immutable release commit, as in the rehearsal.
  release-ci:
    needs: release-target
    if: ${{ !cancelled() && needs.release-target.outputs.release_created == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-target.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
      actions: read

  release-equality:
    needs: release-target
    if: ${{ !cancelled() && needs.release-target.outputs.release_created == 'true' }}
    uses: ./.github/workflows/be-equality.yml
    with:
      ref: ${{ needs.release-target.outputs.sha }}
    permissions:
      contents: read

  # Publish the release-please draft or the explicitly validated draft from
  # workflow_dispatch. Drafts are found by ID because they cannot be looked up
  # by tag. Safe to re-run: uploads replace draft assets; a published release
  # is only verified.
  publish:
    needs: [release-target, release-ci, release-equality]
    if: ${{ !cancelled() && needs.release-target.outputs.release_created == 'true' && needs.release-ci.result == 'success' && needs.release-equality.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 13  # 2 x 379 s, n=1, run 39533130210; provisional
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ needs.release-target.outputs.sha }}
      SOURCE_REF: refs/heads/main
      TAG: ${{ needs.release-target.outputs.tag_name }}
      ID: ${{ needs.release-target.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-target.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*-*
          path: dist/legs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emscripten-libretro-evidence
          path: dist/emscripten-evidence
      - name: Use verified GitHub CLI
        run: |
          sh scripts/fetch-pin.sh gh-linux-x86_64 "$RUNNER_TEMP/gh"
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh/bin/gh" --version
      - run: sh scripts/publish.sh prepare dist
      # Publishing a draft whose target differs from main under
      # .github/workflows requires Workflows: write. GITHUB_TOKEN cannot
      # receive that permission; the release App installation can.
      - id: dispatch-app
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MUHTARI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MUHTARI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - id: state
        env:
          GH_TOKEN: ${{ steps.dispatch-app.outputs.token || github.token }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft) || exit 1
          case $draft in true | false) ;; *) echo "invalid release draft state" >&2; exit 1 ;; esac
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch-app.outputs.token || github.token }}
        run: sh scripts/publish.sh upload "$TAG" "$ID" dist
      - if: steps.state.outputs.draft == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - if: steps.state.outputs.draft == 'true'
        run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --latest would.
      - name: Publish as latest
        if: steps.state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch-app.outputs.token || github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
      - run: sh scripts/publish.sh verify "$TAG" dist

  # The README's install line, verbatim, against the latest release.
  install-line-latest:
    needs: [release-target, publish]
    if: ${{ !cancelled() && needs.release-target.outputs.release_created == 'true' && needs.publish.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 5  # network floor; max 7 s, n=1, run 39533130210; provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-target.outputs.sha }}
      - run: >-
          cmake -DREADME=README.md
          -DBASE_URL=https://github.com/szTheory/muhtari/releases/latest/download/
          -P tests/cmake/install_line.cmake
